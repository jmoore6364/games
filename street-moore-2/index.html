<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Street Moore II</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    font-family: "Trebuchet MS", system-ui, sans-serif;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas {
    background: #000;
    touch-action: none;
    max-width: 100vw; max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  #hint {
    position: fixed; bottom: 4px; left: 0; right: 0;
    text-align: center; color: #778; font: 11px monospace;
    user-select: none; pointer-events: none; z-index: 5;
  }
  #touch-ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  .tbtn {
    position: absolute; pointer-events: auto;
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.09); border: 2px solid rgba(120,200,255,0.4);
    color: #fff; font: bold 15px monospace;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .tbtn.on { background: rgba(120,200,255,0.4); }
  .pad { border-color: rgba(180,220,255,0.45); }
  .b-left  { left: calc(16px + env(safe-area-inset-left,0px));  bottom: calc(46px + env(safe-area-inset-bottom,0px)); }
  .b-right { left: calc(92px + env(safe-area-inset-left,0px));  bottom: calc(46px + env(safe-area-inset-bottom,0px)); }
  .b-up    { left: calc(54px + env(safe-area-inset-left,0px));  bottom: calc(112px + env(safe-area-inset-bottom,0px)); }
  .b-down  { left: calc(54px + env(safe-area-inset-left,0px));  bottom: calc(0px  + env(safe-area-inset-bottom,0px)); }
  .b-pl { right: calc(96px + env(safe-area-inset-right,0px)); bottom: calc(112px + env(safe-area-inset-bottom,0px)); border-color: rgba(255,220,120,0.6); }
  .b-ph { right: calc(30px + env(safe-area-inset-right,0px)); bottom: calc(130px + env(safe-area-inset-bottom,0px)); border-color: rgba(255,180,80,0.7); }
  .b-kl { right: calc(96px + env(safe-area-inset-right,0px)); bottom: calc(46px  + env(safe-area-inset-bottom,0px)); border-color: rgba(120,255,180,0.6); }
  .b-kh { right: calc(30px + env(safe-area-inset-right,0px)); bottom: calc(64px  + env(safe-area-inset-bottom,0px)); border-color: rgba(80,220,160,0.7); }
  .b-sp { right: calc(160px + env(safe-area-inset-right,0px)); bottom: calc(84px + env(safe-area-inset-bottom,0px)); border-color: rgba(255,120,160,0.7); font-size: 12px; }
  .b-start { left: 50%; transform: translateX(-50%); top: 8px; width: 70px; height: 30px; border-radius: 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="360"></canvas>
</div>
<div id="hint">
  &larr;&rarr; move &middot; &darr; crouch &middot; &uarr;/Space jump &middot; hold away = block &middot; J/K punch (light/heavy) &middot; N/M kick &middot; fireball: &darr;&searr;&rarr;+punch &middot; uppercut: &rarr;&darr;&searr;+punch &middot; Enter start/pause &middot; 0 mute
</div>
<div id="touch-ui">
  <div class="tbtn pad b-left"  data-k="ArrowLeft">&larr;</div>
  <div class="tbtn pad b-right" data-k="ArrowRight">&rarr;</div>
  <div class="tbtn pad b-up"    data-k="ArrowUp">&uarr;</div>
  <div class="tbtn pad b-down"  data-k="ArrowDown">&darr;</div>
  <div class="tbtn b-pl" data-k="j">LP</div>
  <div class="tbtn b-ph" data-k="k">HP</div>
  <div class="tbtn b-kl" data-k="n">LK</div>
  <div class="tbtn b-kh" data-k="m">HK</div>
  <div class="tbtn b-sp" data-k="Special">SP</div>
  <div class="tbtn b-start" data-k="Enter">START</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
