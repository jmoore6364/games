<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Excitemoore</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<style>
  :root {
    --sal: env(safe-area-inset-left, 0px);  --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0806;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    font-family: 'Courier New', monospace; color: #e8d8c0; }
  #stage { position: relative; line-height: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #181008; image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(0,0,0,0.85), 0 0 0 2px #3a2a12 inset; }
  #hint { position: fixed; bottom: calc(3px + var(--sab)); left: 0; right: 0; text-align: center;
    color: #7a6648; font: 11px 'Courier New', monospace; pointer-events: none; z-index: 5;
    padding: 0 6px; }
  /* on-screen touch controls */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  .pad { position: absolute; bottom: calc(24px + var(--sab)); left: calc(18px + var(--sal));
    width: 168px; height: 168px; }
  .dbtn { position: absolute; width: 56px; height: 56px; pointer-events: auto;
    background: rgba(230,180,90,0.12); border: 2px solid rgba(245,200,110,0.4);
    border-radius: 12px; color: #f2dcb0; font: bold 22px monospace;
    display: flex; align-items: center; justify-content: center; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .dbtn:active { background: rgba(230,180,90,0.42); }
  #d-up    { left: 56px; top: 0; }
  #d-left  { left: 0; top: 56px; }
  #d-right { left: 112px; top: 56px; }
  #d-down  { left: 56px; top: 112px; }
  #d-act { position: absolute; bottom: calc(104px + var(--sab)); right: calc(24px + var(--sar));
    width: 74px; height: 74px; pointer-events: auto; border-radius: 50%;
    background: rgba(230,80,60,0.18); border: 2px solid rgba(250,110,90,0.5); color: #f4c2b2;
    font: bold 13px monospace; display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #d-act:active { background: rgba(230,80,60,0.46); }
  #d-start { position: absolute; bottom: calc(34px + var(--sab)); right: calc(20px + var(--sar));
    width: 92px; height: 50px; pointer-events: auto; background: rgba(120,200,240,0.16);
    border: 2px solid rgba(140,210,250,0.5); border-radius: 14px; color: #b8e2f4;
    font: bold 15px monospace; display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #d-start:active { background: rgba(120,200,240,0.44); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="224"></canvas>
</div>
<div id="touch">
  <div class="pad">
    <div id="d-up" class="dbtn">&#9650;</div>
    <div id="d-left" class="dbtn">&#9664;</div>
    <div id="d-right" class="dbtn">&#9654;</div>
    <div id="d-down" class="dbtn">&#9660;</div>
  </div>
  <div id="d-act">TURBO</div>
  <div id="d-start">START</div>
</div>
<div id="hint">RIGHT accelerate &middot; SPACE turbo (watch the heat) &middot; UP/DOWN lanes &middot; in air LEFT/RIGHT lean &middot; ENTER start &middot; M mute</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
